apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-backend
  namespace: jarvis
  labels:
    app: jarvis-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-backend
  template:
    metadata:
      labels:
        app: jarvis-backend
    spec:
      imagePullSecrets:
        - name: acr-creds
      containers:
        - name: jarvis-backend
          image: acr2bkndb2inonprod.azurecr.io/jarvis-backend:v1
          ports:
            - containerPort: 8000
          env:
            - name: NVIDIA_MODEL
              value: "nvidia/nemotron-3.5-lightning-30b-a3b"
            - name: MONGO_DB_NAME
              value: "jarvis"
          envFrom:
            - secretRef:
                name: jarvis-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-backend
  namespace: jarvis
spec:
  selector:
    app: jarvis-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: LoadBalancer